<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Evaluación Práctica: Acta de Procedimiento</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #0284c7;
      --bg: #f1f5f9;
      --card: #ffffff;
      --success: #16a34a;
      --error: #dc2626;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: #0f172a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px;
    }

    .app-container {
      max-width: 650px;
      width: 100%;
      height: 100%;
      margin: 0 auto;
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-compact {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid var(--border);
      padding-bottom: 6px;
    }

    h1 {
      font-size: 0.95rem;
      color: var(--primary);
      text-transform: uppercase;
      font-weight: 800;
    }

    .timer {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      background: #e0f2fe;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .box-container {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
      background: #fafafa;
      -webkit-overflow-scrolling: touch;
    }

    .bank-theme {
      background-color: #f8fafc;
      border-style: dashed;
      border-color: #94a3b8;
    }

    .target-theme {
      background-color: #ffffff;
      border-color: #3b82f6;
    }

    .chip {
      background: white;
      border: 1px solid #94a3b8;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      line-height: 1.25;
      user-select: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .chip:active {
      transform: scale(0.96);
    }

    .chip.placed {
      background-color: #eff6ff;
      border-color: #93c5fd;
      color: var(--primary);
    }

    .chip.correct {
      background-color: #dcfce7 !important;
      border-color: var(--success) !important;
      color: #15803d !important;
    }

    .chip.incorrect {
      background-color: #fee2e2 !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }

    /* Modal Registro */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.65);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .modal input {
      width: 100%;
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      margin: 12px 0;
      text-transform: uppercase;
    }

    /* Ranking */
    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.8rem;
    }

    .ranking-table th, .ranking-table td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
    }

    .ranking-table th {
      background-color: #f1f5f9;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="app-container" id="gameScreen">
    <div class="header-compact">
      <h1>Acta Policial</h1>
      <div class="timer" id="timerDisplay">00:00</div>
    </div>

    <!-- Banco de Palabras -->
    <div class="panel-section">
      <div class="section-label">
        <span>Palabras Disponibles</span>
        <span id="bankCount">0</span>
      </div>
      <div class="box-container bank-theme" id="bankBox"></div>
    </div>

    <!-- Redacción del Acta -->
    <div class="panel-section">
      <div class="section-label">
        <span>Acta en Redacción (Tu orden)</span>
        <span id="targetCount">0 / 31</span>
      </div>
      <div class="box-container target-theme" id="targetBox"></div>
    </div>

    <button class="btn btn-primary" onclick="openFinishModal()">Finalizar y Entregar</button>
  </div>

  <!-- Modal de Calificación y Envío -->
  <div class="modal" id="finishModal">
    <div class="modal-content">
      <h2 style="font-size: 1.1rem; color: var(--primary);">Registro del Cadete</h2>
      <p style="font-size: 0.8rem; color: #64748b; margin-top: 4px;">Ingresa tus datos para calificar y guardar tu posición en el ranking.</p>
      
      <input type="text" id="cadetName" placeholder="APELLIDO Y NOMBRES" required>
      
      <button class="btn btn-primary" id="submitBtn" onclick="submitEvaluation()">Enviar Evaluación</button>
      <button class="btn btn-secondary" onclick="closeModal()" style="margin-top: 6px;">Seguir Editando</button>
    </div>
  </div>

  <!-- Pantalla Final y Ranking -->
  <div class="app-container" id="rankingScreen" style="display: none; overflow-y: auto;">
    <div class="header-compact">
      <h1>Resultado de Evaluación</h1>
    </div>
    <p id="userScoreDisplay" style="font-size: 1rem; font-weight: 700; margin-top: 6px; text-align: center;"></p>

    <div class="section-label" style="margin-top: 10px;">Tabla de Posiciones</div>
    <div style="flex: 1; overflow-y: auto;">
      <table class="ranking-table" id="rankingTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Cadete</th>
            <th>Puntos</th>
            <th>Tiempo</th>
          </tr>
        </thead>
        <tbody id="rankingBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTUTsYG4jYlm5q5xTP0pZpQYUgTuqzC9rDE3PhASyAO_DB3v0_Q77qUBBI5Ml-r82rpw/exec";

    const correctSequence = [
      "ACTA PARA DOCUMENTAR PROCEDIMIENTO:",
      "En la CIUDAD de",
      "San Miguel de Tucumán,",
      "Departamento Capital,",
      "Provincia de Tucumán,",
      "República Argentina,",
      "a los 28 días",
      "del mes de Agosto",
      "del año 2026,",
      "siendo las 14:45 horas,",
      "quien suscribe,",
      "Oficial Auxiliar",
      "PONCE SERGIO EDGARDO,",
      "Legajo Personal N° 28.450,",
      "con prestación de servicios en",
      "Comisaría Seccional 1°",
      "y en el mismo cumpliendo las funciones de",
      "Oficial de Servicio,",
      "secundado en este acto por el",
      "Cabo Primero",
      "TESEIRA ROQUE FRANCO JESUS,",
      "Legajo Personal N° 34.120,",
      "con funciones de",
      "Chofer / Auxiliar de Guardia,",
      "ambos pertenecientes al",
      "Departamento General de Policía,",
      "conforme al Artículo 107 “FORMAS”",
      "del C.P.P.T.,",
      "redacto la presente",
      "a los fines y efectos legales",
      "de dejar debidamente documentado lo siguiente:"
    ];

    let seconds = 0;
    let timerInterval = setInterval(() => {
      seconds++;
      const min = String(Math.floor(seconds / 60)).padStart(2, '0');
      const sec = String(seconds % 60).padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${min}:${sec}`;
    }, 1000);

    const bankBox = document.getElementById('bankBox');
    const targetBox = document.getElementById('targetBox');

    function init() {
      bankBox.innerHTML = '';
      targetBox.innerHTML = '';
      const shuffled = [...correctSequence].sort(() => Math.random() - 0.5);
      shuffled.forEach(text => {
        const chip = document.createElement('div');
        chip.classList.add('chip');
        chip.textContent = text;
        chip.dataset.text = text;
        chip.onclick = () => moveToTarget(chip);
        bankBox.appendChild(chip);
      });
      updateCounts();
    }

    function moveToTarget(chip) {
      chip.classList.add('placed');
      chip.onclick = () => moveToBank(chip);
      targetBox.appendChild(chip);
      updateCounts();
    }

    function moveToBank(chip) {
      chip.classList.remove('placed');
      chip.onclick = () => moveToTarget(chip);
      bankBox.appendChild(chip);
      updateCounts();
    }

    function updateCounts() {
      document.getElementById('bankCount').textContent = `${bankBox.children.length} restantes`;
      document.getElementById('targetCount').textContent = `${targetBox.children.length} / ${correctSequence.length}`;
    }

    function openFinishModal() {
      if (targetBox.children.length === 0) {
        alert("Debes colocar fragmentos en el acta antes de entregar.");
        return;
      }
      document.getElementById('finishModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('finishModal').style.display = 'none';
    }

    async function submitEvaluation() {
      const name = document.getElementById('cadetName').value.trim();
      if (!name) {
        alert("Debes ingresar tu Apellido y Nombres.");
        return;
      }

      clearInterval(timerInterval);
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').textContent = "Guardando...";

      const placedChips = Array.from(targetBox.children);
      let correctAnswers = 0;

      placedChips.forEach((chip, i) => {
        if (chip.dataset.text === correctSequence[i]) {
          chip.classList.add('correct');
          correctAnswers++;
        } else {
          chip.classList.add('incorrect');
        }
      });

      const total = correctSequence.length;
      const status = correctAnswers === total ? "Aprobado (Perfecto)" : "Revisar";
      
      const payload = {
        nombre: name,
        puntaje: correctAnswers,
        total: total,
        tiempoSegundos: seconds,
        estado: status
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Error al conectar con Google Sheets:", e);
      }

      closeModal();
      showResults(name, correctAnswers, total);
    }

    async function showResults(name, correct, total) {
      document.getElementById('gameScreen').style.display = 'none';
      const rankingScreen = document.getElementById('rankingScreen');
      rankingScreen.style.display = 'flex';

      const scoreDisplay = document.getElementById('userScoreDisplay');
      scoreDisplay.textContent = `${name}: ${correct}/${total} correctas (${seconds}s)`;
      scoreDisplay.style.color = correct === total ? "var(--success)" : "var(--error)";

      loadRanking(name, correct, seconds);
    }

    async function loadRanking(currentName, currentScore, currentSec) {
      const tbody = document.getElementById('rankingBody');
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Cargando posiciones...</td></tr>';

      let data = [];
      try {
        const res = await fetch(SCRIPT_URL);
        data = await res.json();
      } catch(e) {
        console.error("Error al cargar datos del ranking:", e);
      }

      const exists = data.some(r => r.nombre === currentName && r.tiempo == currentSec);
      if (!exists) {
        data.push({
          nombre: currentName,
          puntaje: `${currentScore} / ${correctSequence.length}`,
          tiempo: currentSec
        });
      }

      data.sort((a, b) => {
        const scoreA = parseInt(a.puntaje) || 0;
        const scoreB = parseInt(b.puntaje) || 0;
        if (scoreB !== scoreA) return scoreB - scoreA;
        return (parseInt(a.tiempo) || 0) - (parseInt(b.tiempo) || 0);
      });

      tbody.innerHTML = '';
      data.forEach((row, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>#${idx + 1}</strong></td>
          <td>${row.nombre}</td>
          <td>${row.puntaje}</td>
          <td>${row.tiempo}s</td>
        `;
        tbody.appendChild(tr);
      });
    }

    init();
  </script>
</body>
</html>
